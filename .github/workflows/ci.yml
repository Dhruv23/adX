name: CI

# The gate (phase_0.md 4.7). Every step is a hard failure. There is no warning
# tier - a warning tier is how iteration one accumulated 9,205 untested lines.
#
# Each gate has been deliberately broken once and observed to turn this workflow
# red; see plans/STATE.md, Phase 0.

# A change that touches only notes - the plans/ ledger, or Markdown anywhere - builds
# nothing and runs nothing. docs/adx-format-v2.md is the exception: the diagnostic-code
# test reads it. (`paths` rather than `paths-ignore`, because only `paths` lets a
# later pattern re-include a file an earlier one excluded.)
#
# This is the per-push gate. The full check - clang-tidy over every file, and the
# loader fuzz - is .github/workflows/full-check.yml, run when a phase completes.
on:
  push:
    paths:
      - '**'
      - '!plans/**'
      - '!**.md'
      - 'docs/adx-format-v2.md'
  pull_request:
    paths:
      - '**'
      - '!plans/**'
      - '!**.md'
      - 'docs/adx-format-v2.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: windows-x64 ${{ matrix.build_type }}
    runs-on: windows-latest
    # About an hour when green (clang-tidy is most of it). Without a limit a hang runs
    # into GitHub's six hours, as Phase 7's first push did.
    timeout-minutes: 120
    # sccache puts compiler output in the Actions cache, so an unchanged translation unit
    # is not recompiled. CMake reads the launcher variables from the environment for both
    # the preset build and the scikit-build-core build under `pip install -e`. MSVC's
    # default /Zi writes debug info to a shared PDB, which sccache cannot cache; /Z7
    # (Embedded) can, so it is set for both builds.
    env:
      SCCACHE_GHA_ENABLED: 'true'
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SKBUILD_CMAKE_DEFINE: CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debug and RelWithDebInfo both carry ADX_ENABLE_RT_GUARD, and phase_1.md §6
          # requires the realtime gate to pass in both - RelWithDebInfo is where it
          # runs at optimised speed, which is the configuration a real session
          # resembles. Release has the guard compiled out by design and is here to
          # prove the code still builds and runs without it.
          #
          # The [.slow] suite (the 60 s realtime gate among it) runs per push only in
          # the optimised builds. In Debug it runs locally when a phase completes
          # (plans/STATE.md, "Phase completion").
          #
          # clang-tidy runs in Debug and Release only. RelWithDebInfo defines NDEBUG
          # exactly as Release does - the macro the Phase 2 Release-only finding hung
          # on - so tidying it as well checked the same code twice.
          #
          # The Python half (pip install, pytest, every source lint) runs in one job.
          # `pip install -e` builds the bindings through scikit-build-core the same way
          # whatever the matrix entry, so the three jobs were testing one binary three
          # times, and the lints read source files, the same in every configuration.
          - build_type: Debug
            preset: windows-x64-debug
            ctest_args: -LE slow
            tidy: true
            python: false
          - build_type: RelWithDebInfo
            preset: windows-x64-relwithdebinfo
            ctest_args: ''
            tidy: false
            python: false
          - build_type: Release
            preset: windows-x64-release
            ctest_args: ''
            tidy: true
            python: true

    steps:
      # Full history, so clang-tidy can diff against the push's previous head.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The presets use the Ninja generator exclusively, because clang-tidy needs a
      # compile database and the Visual Studio generator does not emit one
      # (phase_0.md 9). Ninja therefore needs cl already in the environment.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/AdxDependencies.cmake') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # The Qt C++ SDK the scene-graph plugin (bindings/qml) builds against: PySide6
      # ships Qt's DLLs but not its headers or import libraries (phase_5.md 4.3). Only
      # the downloaded archives are cached (~200 MB, not the extracted 2 GB).
      - name: Cache the Qt SDK archives
        uses: actions/cache@v4
        with:
          path: .qt/dl
          key: qt-${{ runner.os }}-${{ hashFiles('tools/fetch_qt.py') }}

      - name: Fetch the Qt SDK
        run: python tools/fetch_qt.py

      # 3. Configure and build.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        id: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: sccache stats
        if: ${{ !cancelled() }}
        run: sccache --show-stats

      # 4. The Python package, before any test: it is also what installs the pinned
      # ruff, mypy and clang-tidy. Installed after ctest, one failing test skipped the
      # install and every lint gate below then failed for want of its tool, which reads
      # as five broken gates when there is one.
      #
      # This also builds the bindings a second time through scikit-build-core, which
      # is the path a user's `pip install` takes and therefore the one that has to
      # keep working.
      - name: Install the Python package
        id: install
        if: ${{ matrix.python }}
        run: pip install -e ".[dev]"

      # A tidy job without the Python half needs only the pinned clang-tidy, read from
      # pyproject's dev extra so the pin lives in one place.
      - name: Install the pinned clang-tidy
        if: ${{ matrix.tidy && !matrix.python }}
        run: |
          $pin = python -c "import tomllib; print(next(d for d in tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies']['dev'] if d.startswith('clang-tidy')))"
          pip install $pin

      # 5. C++ tests.
      # One at a time. --parallel 4 was tried (2026-11-05): on the runner's four cores
      # the regular set's timing tests (levels worst call, the watchdog, analysis
      # cancellation, the Voice's background render) starved each other and failed.
      - name: ctest
        shell: bash
        run: |
          ctest --preset ${{ matrix.preset }} ${{ matrix.ctest_args }} --output-on-failure 2>&1 | tee ctest.log
          exit "${PIPESTATUS[0]}"

      # Job logs need a token to read; annotations do not. Surface what failed.
      - name: ctest summary
        if: failure() && hashFiles('ctest.log') != ''
        shell: bash
        run: |
          grep -n -E 'Failed|Timeout|REQUIRE|worst|xrun' ctest.log | head -20 | while IFS= read -r l; do echo "::error title=ctest::${l:0:400}"; done
          # Each Catch2 failure with what follows it: the expression, its expansion and
          # the INFO messages (which case of a table-driven test failed).
          grep -n -A8 'FAILED:' ctest.log | head -60 | while IFS= read -r l; do echo "::error title=ctest detail::${l:0:400}"; done

      # 6. Python tests. Independent of ctest, so a C++ failure does not hide them.
      # The GPU frame-rate test cannot run here - no usable GPU on the runners - and is
      # run locally at phase completion (phase_5.md 4.9). Everything else Qt runs on the
      # offscreen platform (tests/python/conftest.py).
      # A green run took 3-6 minutes serially; pytest-xdist spreads it over the runner's
      # cores (every test has its own window, settings and tmp_path). A hung test is
      # also caught sooner, with its stack, by the watchdog in tests/python/conftest.py;
      # this limit is the backstop.
      - name: pytest
        if: ${{ matrix.python && !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          pytest -m "not gpu and not serial" -n auto
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Time-budget tests alone, with the CPU to themselves.
          pytest -m "serial and not gpu"

      # Steps 7-14 are the lint gates, and they all carry `if: !cancelled()`.
      #
      # By default Actions stops a job at the first failing step, which means a run
      # reports one broken gate and hides the rest - a developer then needs one push
      # per problem to find out how many there are. These are independent of each
      # other, so every one reports on every run. (clang-tidy is the exception: it
      # reads the compile database, so it is conditioned on the build having
      # succeeded rather than merely not cancelled.)
      #
      # The job still fails if any of them fails. There is no warning tier. All but
      # clang-tidy read only source, so they run in the one job with the Python half.

      # 7. Formatting.
      - name: clang-format
        if: ${{ matrix.python && !cancelled() }}
        run: python tools/lint.py format --check

      # 8. Static analysis, including the realtime ban list on realtime paths. Per
      # push it checks only the files the change can reach - a changed file, or one
      # including a changed header - against the push's previous head (a pull
      # request's base). A change to the tidy config, the driver, the build or the
      # pinned clang-tidy makes it check everything, as does a previous head this
      # clone does not have. full-check.yml checks every file.
      - name: clang-tidy
        if: ${{ matrix.tidy && !cancelled() && steps.build.outcome == 'success' }}
        env:
          TIDY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python tools/lint.py tidy --build-dir build/${{ matrix.preset }} --changed-since $env:TIDY_BASE

      # 9. Python lint. Two steps rather than one: in PowerShell only the last
      # command in a multi-line `run` decides the step's exit status, so chaining
      # them would silently swallow a ruff check failure.
      - name: ruff check
        if: ${{ matrix.python && !cancelled() }}
        run: ruff check app tests/python tools

      - name: ruff format
        if: ${{ matrix.python && !cancelled() }}
        run: ruff format --check app tests/python tools

      # 10. Python types.
      - name: mypy
        if: ${{ matrix.python && !cancelled() }}
        run: mypy --strict app

      # 11. The one hard limit no linter checks.
      - name: Header length
        if: ${{ matrix.python && !cancelled() }}
        run: python tools/lint.py headers

      # 12. Phase 2: no exception-based number parsing in the format layer.
      - name: Format safety
        if: ${{ matrix.python && !cancelled() }}
        run: python tools/lint.py format-safety

      # 13. Phase 3: the Phase 11 checkpoint. No engine code outside engine/transport/
      # may own a playback position - time is a set of sources, passed as parameters.
      - name: No global position
        if: ${{ matrix.python && !cancelled() }}
        run: python tools/lint.py positions

      # 15. Phase 5: FINAL_PLAN 2.2's three rules, mechanically - only engine_bridge.py
      # imports the engine, no binding returns per-note objects, every binding releases
      # the GIL or says why not, no pybind11 in engine/ - and the 150-line limit in app/.
      - name: Three rules
        if: ${{ matrix.python && !cancelled() }}
        run: python tools/lint.py rules

      # 14. Phase 4: DSP code calls engine/dsp/Math.h, never a library transcendental,
      # so golden hashes agree across Debug, RelWithDebInfo and Release.
      - name: Deterministic DSP math
        if: ${{ matrix.python && !cancelled() }}
        run: python tools/lint.py dsp-math

      # 16. Phase 10.5: a definition-of-done box that asks the user to check software is
      # a gap in the agent's tests; only hardware halves and judgement gates may.
      - name: Plans gate
        if: ${{ matrix.python && !cancelled() }}
        run: python tools/lint.py plans
