# Open-source plugins the scenarios host (phase_10.5.md 4.6). Test fixtures only: never
# shipped, linked or committed. tools/fetch_test_plugins.py downloads each archive into
# %LOCALAPPDATA%/adx-test-plugins (ADX_TEST_PLUGINS moves it), refuses a hash mismatch,
# and unpacks the listed bundles. A replacement is a recorded change to this file.
#
# Between them: a VST3 instrument, a VST3 effect, a CLAP instrument and a CLAP effect,
# every one with an editor.

